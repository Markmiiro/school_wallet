  <!--
    Launch splash: the mark alone on navy, drawn before Flutter has loaded,
    so a parent goes straight from the icon they tapped to the same mark.
    Timings are the launch spec's (docs/design/nuvora-app-launch.html):
    fade in 180 ms, settle from 1.18 to 1 over 340 ms, hold to 1000 ms,
    then fade out over 240 ms once Flutter has drawn its first frame. The
    mark only fades and scales uniformly; anything else is brand misuse.
    The wordmark and tagline wait for the real wordmark vector.
  -->
  <style>
    #nv-splash {
      position: fixed; inset: 0; z-index: 2147483647;
      display: flex; align-items: center; justify-content: center;
      background: #102B5C;
      transition: opacity 240ms cubic-bezier(.22,1,.36,1);
    }
    #nv-splash svg {
      display: block; width: 72px; height: auto;
      animation: nv-mark-fade 180ms cubic-bezier(.22,1,.36,1) both,
                 nv-mark-settle 340ms cubic-bezier(.22,1,.36,1) both;
    }
    #nv-splash.nv-out { opacity: 0; pointer-events: none; }
    @keyframes nv-mark-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes nv-mark-settle { from { transform: scale(1.18); } to { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) {
      #nv-splash, #nv-splash svg { animation: none; transition: none; }
    }
  </style>
</head>

  <script>
    (function () {
      var splash = document.getElementById('nv-splash');
      var reduce = window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var hold = reduce ? 400 : 1000;
      var fade = reduce ? 0 : 240;
      var start = performance.now();
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(function () {
          splash.classList.add('nv-out');
          setTimeout(function () { splash.remove(); }, fade);
        }, Math.max(0, hold - (performance.now() - start)));
      }, { once: true });
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization

  <!--
    Optional fingerprint / face unlock for the app lock (WebAuthn, platform
    authenticator only). Used from lib/core/biometric/biometric_web.dart.

    This is a check on THIS device: the phone's own sensor confirms the
    person, and nothing is sent to the server. It guards the lock screen
    the same way the lock screen itself does; it is not a sign-in. Where
    the phone has no such sensor (most cheap Android), available() is
    false and the app offers only the PIN.
  -->
  <script>
    (function () {
      function b64(buf) {
        return btoa(String.fromCharCode.apply(null, new Uint8Array(buf)));
      }
      function unb64(s) {
        return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); });
      }
      function random(n) { return crypto.getRandomValues(new Uint8Array(n)); }

      window.nuvoraBiometric = {
        available: async function () {
          try {
            return !!(window.isSecureContext && window.PublicKeyCredential &&
              await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());
          } catch (e) { return false; }
        },
        // Returns the new credential's id (base64), or "" if refused.
        enroll: async function (name, displayName) {
          try {
            var cred = await navigator.credentials.create({ publicKey: {
              rp: { name: 'Nuvora' },
              user: { id: random(16), name: name, displayName: displayName },
              challenge: random(32),
              pubKeyCredParams: [{ type: 'public-key', alg: -7 },
                                 { type: 'public-key', alg: -257 }],
              authenticatorSelection: { authenticatorAttachment: 'platform',
                                        userVerification: 'required',
                                        residentKey: 'discouraged' },
              attestation: 'none', timeout: 60000 } });
            return cred ? b64(cred.rawId) : '';
          } catch (e) { return ''; }
        },
        // True only if the device confirmed the user (UP and UV flags).
        verify: async function (id) {
          try {
            var a = await navigator.credentials.get({ publicKey: {
              challenge: random(32),
              allowCredentials: [{ type: 'public-key', id: unb64(id) }],
              userVerification: 'required', timeout: 60000 } });
            var flags = new Uint8Array(a.response.authenticatorData)[32];
            return (flags & 0x05) === 0x05;
          } catch (e) { return false; }
        }
      };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
